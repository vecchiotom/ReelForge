services:
  postgres:
    container_name: reelforge-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reelforge}
    # Loopback-only. A published port binds 0.0.0.0 by default, which puts it on
    # the host gateway address that every container — including a sandbox — can
    # route to, as well as on the LAN. Only nginx is meant to be reachable.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reelforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      reelforge:
        aliases:
          - postgres

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reelforge

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing myminio/$${MINIO_BUCKET:-reelforge};
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-reelforge}
    networks:
      - reelforge

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - reelforge

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - reelforge

  inference:
    build:
      context: ./inference
      dockerfile: src/ReelForge.Inference.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-reelforge};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: ${JWT_ISSUER:-reelforge-api}
      Jwt__Audience: ${JWT_AUDIENCE:-reelforge-inference}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env to a random value of at least 32 characters (openssl rand -hex 32)}
      MinIO__Endpoint: http://minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      MinIO__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      MinIO__BucketName: ${MINIO_BUCKET:-reelforge}
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAI__DeploymentName: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      VectorSearch__QdrantUrl: http://qdrant:6333
      VectorSearch__QdrantGrpcPort: ${VECTOR_QDRANT_GRPC_PORT:-6334}
      VectorSearch__EmbeddingDeployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      VectorSearch__ChunkSizeTokens: ${VECTOR_CHUNK_SIZE_TOKENS:-512}
      VectorSearch__ChunkOverlapTokens: ${VECTOR_CHUNK_OVERLAP_TOKENS:-64}
      VectorSearch__SmallFileThresholdTokens: ${VECTOR_SMALL_FILE_THRESHOLD_TOKENS:-1500}
      DataProtection__KeysPath: /keys
    volumes:
      - dpkeys:/keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - reelforge


  workflow-engine:
    build:
      context: ./inference
      dockerfile: src/ReelForge.WorkflowEngine/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-reelforge};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: ${JWT_ISSUER:-reelforge-api}
      Jwt__Audience: ${JWT_AUDIENCE:-reelforge-inference}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env to a random value of at least 32 characters (openssl rand -hex 32)}
      MinIO__Endpoint: http://minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      MinIO__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      MinIO__BucketName: ${MINIO_BUCKET:-reelforge}
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAI__DeploymentName: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      InferenceApi__BaseUrl: http://inference:8080
      Sandbox__BaseUrl: http://sandbox-executor:8080
      Sandbox__ApiToken: ${SANDBOX_API_TOKEN:?set SANDBOX_API_TOKEN in .env to a long random value}
      WorkflowEngine__MaxConcurrency: ${WORKFLOW_MAX_CONCURRENCY:-4}
      DataProtection__KeysPath: /keys
      VideoEditing__ScratchPath: /var/tmp/reelforge-video
      VideoEditing__FfmpegPath: ffmpeg
      VideoEditing__FfprobePath: ffprobe
      VideoEditing__MaxConcurrentJobs: ${VIDEO_MAX_CONCURRENT_JOBS:-1}
      VideoEditing__AnalyzeTimeoutSeconds: ${VIDEO_ANALYZE_TIMEOUT_SECONDS:-900}
      VideoEditing__CompileTimeoutSeconds: ${VIDEO_COMPILE_TIMEOUT_SECONDS:-1800}
    volumes:
      - dpkeys:/keys
      - videoscratch:/var/tmp/reelforge-video
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/api/v1/workflow-engine/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - reelforge

  # Builds the minimal image that untrusted, model-authored code runs in, then
  # exits. It is a build-and-exit service (same pattern as minio-init) because
  # the image has to exist on the daemon before sandbox-executor can `docker run`
  # it — nothing pulls it, and the executor never builds images itself.
  sandbox-runtime:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      target: sandbox-runtime
    image: reelforge-sandbox-runtime:local
    command: ["true"]
    restart: "no"
    network_mode: none

  sandbox-executor:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      target: control-plane
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    image: reelforge-sandbox-executor:local
    restart: unless-stopped
    environment:
      PORT: 8080
      # The untrusted runtime image, NOT this service's own image. Reusing the
      # control-plane image here would hand every sandbox a Docker CLI.
      SANDBOX_IMAGE: reelforge-sandbox-runtime:local
      SANDBOX_ROOT: /var/lib/reelforge/sandboxes
      # Owned and created by this service (with --internal), not by compose —
      # see the note under `networks:` at the bottom of this file.
      SANDBOX_NETWORK: sandbox-net
      # false => the sandbox network is created --internal: no internet, and no
      # route to the host gateway, which is the only thing that keeps sandboxed
      # code away from every port published on the host. Turning this on also
      # re-enables POST /packages. Read docs/sandbox-service.md before you do.
      SANDBOX_NETWORK_EGRESS: ${SANDBOX_NETWORK_EGRESS:-false}
      # No default on purpose: the service refuses to start without it rather
      # than silently exposing an API that can start containers and write files.
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:?set SANDBOX_API_TOKEN in .env to a long random value}
      SANDBOX_TTL: ${SANDBOX_TTL:-1h}
      SANDBOX_EXEC_TIMEOUT: ${SANDBOX_EXEC_TIMEOUT:-5m}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-2g}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-2}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/reelforge/sandboxes:/var/lib/reelforge/sandboxes
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Deliberately NOT attached to sandbox-net. This service reaches sandbox
    # containers through the Docker socket (`docker exec`) and the bind-mounted
    # workspace, never over TCP, so it has no reason to be routable from the
    # network untrusted code sits on — and every reason not to be, since it holds
    # the Docker socket.
    networks:
      - reelforge

  go-api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-reelforge}?sslmode=disable
      INFERENCE_URL: http://inference:8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env to a random value of at least 32 characters (openssl rand -hex 32)}
      JWT_ISSUER: ${JWT_ISSUER:-reelforge-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-reelforge-inference}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reelforge.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      inference:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reelforge

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Switch between 'development' (Turbopack hot reload) and 'production' (precompiled standalone)
      target: ${WEB_BUILD_TARGET:-development}
    # ── Volume Mounts ──────────────────────────────────────
    # REQUIRED for development mode (hot reload)
    # MUST BE REMOVED/COMMENTED for production mode
    # ───────────────────────────────────────────────────────
    # volumes:
    #   - ./web:/app
    #   - /app/node_modules
    #   - /app/.next
    # ───────────────────────────────────────────────────────
    environment:
      - NODE_ENV=${WEB_NODE_ENV:-development}
      # The Node inspector is unauthenticated arbitrary code execution for anyone
      # who can open the port. It must stay bound to loopback on the host (below)
      # and should be empty in any deployment that is not a developer's machine.
      - NODE_OPTIONS=${WEB_NODE_OPTIONS:---inspect=127.0.0.1:9229}
      - PORT=3000
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env to a random value of at least 32 characters (openssl rand -hex 32)}
    # Loopback-only: 3000 bypasses nginx and therefore every auth check nginx
    # performs, and 9229 is remote code execution in this container.
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9229:9229"
    restart: unless-stopped
    depends_on:
      inference:
        condition: service_healthy
      go-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reelforge

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/auth.js:/etc/nginx/auth.js:ro
    depends_on:
      web:
        condition: service_healthy
        restart: true
      go-api:
        condition: service_healthy
        restart: true
      inference:
        condition: service_healthy
        restart: true
      workflow-engine:
        condition: service_healthy
        restart: true
      sandbox-executor:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1/health && wget -qO/dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reelforge

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 20
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  miniodata:
  rabbitmqdata:
  dpkeys:
  videoscratch:

networks:
  reelforge:

# `sandbox-net` is intentionally NOT declared here. Compose would create it as
# `<project>_sandbox-net`, but sandbox containers are started by the executor via
# the Docker API with `--network sandbox-net` — an unprefixed name — so a compose
# declaration is a different network that nothing ever joins. Declaring it looked
# like it applied isolation settings to the sandbox while applying them to
# nothing at all. The executor creates the real network itself, with --internal,
# and refuses to start if an existing network of that name lacks it.
