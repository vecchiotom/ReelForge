server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    set $go_api http://go-api:8080;
    set $inference_api http://inference:8080;
    set $workflow_engine http://workflow-engine:8080;
    set $web_app http://web:3000;
    set $site_app http://site:3000;
    set $caddy http://caddy:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Answers Let's Encrypt's HTTP-01 challenge by forwarding to the `caddy`
    # cert-manager sidecar (docker-compose.yml, `tls` profile; see
    # docs/tls.md). A variable-based proxy_pass defers DNS resolution to
    # request time, so nginx starts fine even when the `tls` profile isn't
    # running and `caddy` doesn't exist on the network.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass $caddy;
    }

    # This is the default, plain-HTTP-still-works server block: used whenever
    # FORCE_HTTPS is not "true" (the default), so a fresh `docker compose up`
    # with no domain configured keeps working over http://localhost exactly
    # as before TLS support was added. Set FORCE_HTTPS=true once you have a
    # real domain and have confirmed https:// works end to end.
    include /etc/nginx/locations.conf;
}
