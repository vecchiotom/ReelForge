server {
    listen 80;
    server_name _;

    set $caddy http://caddy:80;

    # Answers Let's Encrypt's HTTP-01 challenge by forwarding to the `caddy`
    # cert-manager sidecar (docker-compose.yml, `tls` profile; see
    # docs/tls.md).
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass $caddy;
    }

    # FORCE_HTTPS=true: everything else redirects to https://. Only enable
    # this once a real domain + Caddy-issued certificate is confirmed
    # working on :443 (see docs/tls.md) — flipping it on too early with only
    # a self-signed cert just replaces a working http:// dev flow with a
    # browser warning on every request.
    location / {
        return 301 https://$host$request_uri;
    }
}
