location = /api/v1/auth/token {
    proxy_pass $go_api;
}

location = /api/auth/logout {
    if ($request_method != POST) {
        return 405;
    }
    js_content auth.handleLogout;
}

location /api/v1/auth/ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $go_api;
}

location /api/v1/admin/ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $go_api;
}

location /api/v1/workflows/ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $go_api;
}

location ~* ^/api/v1/projects/.+/workflows/.+/executions/.+/events/?$ {
    proxy_set_header Authorization $auth_header;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_pass $go_api;
}

# stop requests are now handled by the Inference API; the earlier
# regex hack routing them to the Go API is no longer needed.
location ~ ^/api/v1/projects/[^/]+/workflows/[^/]+/executions/[^/]+/stop$ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $inference_api;
}

location = /health {
    proxy_pass $go_api;
}

location /api/v1/workflow-engine/ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $workflow_engine;
}

# The sandbox executor is deliberately NOT proxied.
#
# It used to be exposed here with no auth at all (no $auth_header, no
# checks), which made the whole control API reachable from the internet:
# POST a sandbox, PUT a package.json whose "build" script is any shell
# command, POST /exec, and you have unauthenticated remote code execution
# — against a service that holds the Docker socket.
#
# Nothing in the browser calls it. Its only client is the workflow engine,
# which reaches it in-cluster over the reelforge network with a bearer
# token (Sandbox__ApiToken / SANDBOX_API_TOKEN). It must not be routable
# from outside the cluster; do not add a location block for it.

location /api/v1/ {
    proxy_set_header Authorization $auth_header;
    proxy_pass $inference_api;
}

# Dashboard (Next.js `web`, basePath '/app'). ^~ so it wins over the
# regex locations above without further regex evaluation. proxy_pass
# with a bare variable and no URI part forwards /app/... unchanged,
# which is what a Next app with basePath '/app' expects to receive.
location ^~ /app {
    proxy_pass $web_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Public marketing site.
location / {
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
