load_module modules/ngx_http_js_module.so;

events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    js_import auth from /etc/nginx/auth.js;
    js_set $auth_header auth.getAuthHeader;

    # Both files below are (re)generated by docker-entrypoint.sh on every
    # container start: http-server.conf is a straight copy of either
    # http-server-dev.conf or http-server-redirect.conf depending on
    # FORCE_HTTPS, and https-server.conf is https-server.conf.template with
    # SSL_CERT/SSL_KEY substituted in. See docs/tls.md.
    include /etc/nginx/conf.d/http-server.conf;
    include /etc/nginx/conf.d/https-server.conf;
}
