# RabbitMQ 3.13's default `loopback_users = [guest]` restricts the built-in guest account to
# connections originating from localhost. Every service that talks to RabbitMQ here
# (go-api, inference, workflow-engine) connects over the compose network as "rabbitmq:5672",
# never from loopback, so the default silently rejects them with ACCESS_REFUSED. This is a
# local/homelab compose stack with the AMQP port already bound to 127.0.0.1 only
# (docker-compose.yml), so there is no external exposure to defend against here.
loopback_users = none
