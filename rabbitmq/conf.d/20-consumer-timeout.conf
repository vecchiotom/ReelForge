# RabbitMQ's built-in consumer_timeout force-closes the channel (and kills delivery) of any
# message a consumer hasn't acked within this window, regardless of *why* it's taking long -
# CPU load, a slow downstream call, anything. The stock default is 1,800,000 ms (30 minutes),
# introduced in RabbitMQ 3.8.17+ to catch genuinely stuck/poison consumers.
#
# HISTORY - read this before touching the number below.
#
# This setting used to be load-bearing, and it was the wrong tool for the job. The workflow
# engine awaited each entire workflow execution inline inside its MassTransit consumer, so the
# delivery stayed unacked for the execution's whole duration and THIS VALUE silently became a
# hard wall-clock cap on how long any workflow was permitted to run. It was first raised from
# the stock 30 minutes to 2 hours after a 30-minute video analysis kept getting killed and
# mislabelled "Cancelled by user request". That did not fix the bug, it moved the wall: three
# consecutive lean-context-promo executions later died at *exactly* 120.0 minutes each - this
# number to the second - discarding 40+ minutes of completed analysis steps apiece and again
# blaming the user for a kill nobody requested.
#
# The actual fix is in the engine, not here: WorkflowExecutionRequestedConsumer now only
# dispatches, and WorkflowExecutionRunner runs the execution on a background task bound to the
# process lifetime, so deliveries are acked in milliseconds and an execution's duration is no
# longer coupled to any ack deadline. See WorkflowExecutionRunner's class summary.
#
# The value is kept, generous, purely as defence-in-depth for the one delivery that can still be
# held open: a consumer waiting for a free concurrency slot before dispatching. That wait does no
# work, so a timeout there is harmless - the execution is still Queued and the redelivery simply
# starts it later. Do not go back to treating this as a workflow duration budget.
consumer_timeout = 7200000
