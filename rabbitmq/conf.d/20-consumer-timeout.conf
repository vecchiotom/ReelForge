# RabbitMQ's built-in consumer_timeout force-closes the channel (and kills delivery) of any
# message a consumer hasn't acked within this window, regardless of *why* it's taking long -
# CPU load, a slow downstream call, anything. The stock default (1,800,000 ms = 30 minutes,
# introduced in RabbitMQ 3.8.17+ to catch genuinely stuck/poison consumers) is shorter than a
# single WorkflowExecutionRequested message's processing time can legitimately be: one
# VideoAnalyze step alone is allowed up to VideoEditing:AnalyzeTimeoutSeconds (see
# docker-compose.yml, default 900s / configurable up to whatever a real source video needs),
# and a full four-step video-editing workflow (Analyze -> Agent -> Agent -> Compile) can run
# well past 30 minutes on real multi-GB 4K source footage - discovered when a 30-minute
# action-cam analysis kept getting killed with a misleading "Cancelled by user request" despite
# no user action and no resource starvation. 7200000 ms (2 hours) covers the current
# VideoEditing:AnalyzeTimeoutSeconds/CompileTimeoutSeconds ceilings with headroom; raise this
# alongside those if a future source needs longer still.
consumer_timeout = 7200000
